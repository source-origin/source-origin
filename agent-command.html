<style>
  /* ======================================= · 局部样式
     主题：Dark Cosmos（深蓝 #05060d + 金 #f0b90b + 青 #00d4ff）
     复用 facade-v2 版型类：page-hero / badge / btn / container / section
     ============================================ */
  :root {
    --dc-bg: #05060d;
    --dc-panel: rgba(10, 17, 34, 0.72);
    --dc-panel-solid: #0a1122;
    --dc-line: rgba(120, 160, 255, 0.14);
    --dc-gold: #a78bfa;
    --dc-cyan: #00ff88;
    --dc-dim: #93a5cc;
    --dc-text: #e7eefb;
  }

  /* ---------- Hero ---------- */
  .dev-hero {
    text-align: center;
    padding: 96px 20px 40px;
    position: relative;
  }
  .dev-hero h1 {
    font-size: clamp(2.2rem, 5.5vw, 3.6rem);
    margin: 0 auto 14px;
    max-width: 900px;
    line-height: 1.2;
    color: #00d4ff;
    text-shadow: 0 0 18px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.28);
  }
  .dev-hero h1 .gold { color: var(--dc-gold); text-shadow: 0 0 18px rgba(240, 185, 11, 0.6); }
  .dev-hero .dev-tagline {
    color: var(--dc-dim);
    font-size: 17px;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.9;
  }
  .dev-hero .dev-tagline .cyan { color: var(--dc-cyan); }

  .board-wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }
  .board-section { padding: 40px 0 84px; }

  /* ---------- Agent 状态栏 ---------- */
  .agent-bar-wrap { padding: 4px 0 0; }
  .bar-label { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; color: #7ee6a8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .bar-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 10px #00ff88; animation: blip 1.6s infinite; }
  @keyframes blip { 0%,100% {opacity:1} 50% {opacity:.3} }
  .agent-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .agent-chip {
    background: rgba(10,17,34,0.72); border: 1px solid rgba(0,255,136,0.16);
    border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 0 18px rgba(0,255,136,0.05);
  }
  .agent-chip .chip-av { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #06130c; }
  .agent-chip .chip-info { min-width: 0; }
  .agent-chip .chip-name { font-size: 12px; font-weight: 700; color: #dff5ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-chip .chip-st { font-size: 10px; color: #00ff88; letter-spacing: .5px; }
  .agent-chip .chip-st.busy { color: #f5c518; }
  .agent-chip .chip-st.idle { color: #8899bb; }
  /* ---------- 发布区 ---------- */
  .composer {
    background: var(--dc-panel);
    border: 1px solid var(--dc-line);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 0 34px rgba(0, 212, 255, 0.06), 0 20px 48px rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
  }
  .composer-title {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    color: var(--dc-gold);
    margin-bottom: 14px;
  }
  .composer-title .sig { color: var(--dc-cyan); }
  .dev-input, .dev-textarea {
    width: 100%;
    background: rgba(5, 6, 13, 0.85);
    border: 1px solid var(--dc-line);
    border-radius: 10px;
    color: var(--dc-text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
    transition: border-color .25s, box-shadow .25s;
  }
  .dev-input:focus, .dev-textarea:focus {
    outline: none;
    border-color: var(--dc-cyan);
    box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.14);
  }
  .dev-textarea { min-height: 96px; resize: vertical; line-height: 1.7; }
  .composer-field { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .composer-field label {
    font-size: 12px; letter-spacing: 1.5px; color: var(--dc-dim);
    white-space: nowrap; text-transform: uppercase;
  }
  .composer-field .dev-input { margin-bottom: 0; }
  .composer-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin-top: 6px; flex-wrap: wrap;
  }
  .composer-hint { font-size: 12px; color: var(--dc-dim); }
  .composer-hint b { color: var(--dc-cyan); font-weight: 600; }
  .btn-pulse {
    background: linear-gradient(135deg, #f0b90b, #f5c518);
    color: #0a0d18;
    border: none;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 12px 26px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 0 18px rgba(240, 185, 11, 0.35);
  }
  .btn-pulse:hover { transform: translateY(-2px); box-shadow: 0 0 34px rgba(240,185,11,0.7); }
  .btn-pulse:active { transform: translateY(0); }
  .btn-pulse:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- 留言列表头 ---------- */
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    margin: 8px 0 18px;
  }
  .list-head h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    color: #fff; margin: 0;
  }
  .list-count {
    font-size: 12px; color: var(--dc-dim);
    border: 1px solid var(--dc-line); border-radius: 30px;
    padding: 4px 14px; letter-spacing: 1px;
  }
  .list-count b { color: var(--dc-gold); }

  /* ---------- 留言卡片 ---------- */
  .msg-board { display: flex; flex-direction: column; gap: 16px; }
  .msg-card {
    background: var(--dc-panel);
    border: 1px solid var(--dc-line);
    border-left: 3px solid var(--dc-line);
    border-radius: 14px;
    padding: 18px 18px 12px;
    animation: msgIn .45s cubic-bezier(.2,.7,.3,1) both;
  }
  .msg-card.hot { border-left-color: var(--dc-gold); }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .avatar {
    width: 40px; height: 40px; flex: 0 0 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
    color: #07121f;
    border: 1px solid rgba(240, 185, 11, 0.4);
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.18);
  }
  .msg-who { flex: 1; min-width: 0; }
  .msg-name { font-size: 14px; font-weight: 700; color: var(--dc-text); }
  .msg-meta { font-size: 11px; color: var(--dc-dim); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .msg-time { letter-spacing: .5px; }
  .msg-badge {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--dc-cyan);
    border: 1px solid rgba(0, 212, 255, 0.35);
    border-radius: 30px; padding: 1px 8px;
  }
  .msg-body { color: #c9d6ee; font-size: 14px; line-height: 1.8; margin: 0 0 6px 52px; word-break: break-word; }
  .msg-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 10px 52px; }
  .tag {
    font-size: 11px; color: var(--dc-gold);
    background: rgba(240, 185, 11, 0.08);
    border: 1px solid rgba(240, 185, 11, 0.28);
    border-radius: 30px; padding: 2px 10px; letter-spacing: .5px;
  }
  .msg-actions {
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--dc-line);
    padding-top: 10px; margin-top: 4px;
  }
  .act-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--dc-line);
    color: var(--dc-dim);
    border-radius: 8px;
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .2s, border-color .2s, background .2s;
  }
  .act-btn:hover { color: var(--dc-text); border-color: var(--dc-cyan); }
  .act-btn .num { font-weight: 700; }
  .act-like.liked {
    color: var(--dc-gold);
    border-color: rgba(240, 185, 11, 0.55);
    background: rgba(240, 185, 11, 0.08);
  }
  .act-like.liked .num { color: var(--dc-gold); }
  .act-reply.open { color: var(--dc-cyan); border-color: var(--dc-cyan); }

  /* ---------- 回复 ---------- */
  .reply-box { display: none; margin: 6px 0 0 52px; }
  .reply-box.open { display: block; animation: msgIn .3s ease both; }
  .reply-box .dev-textarea { min-height: 56px; margin-bottom: 8px; }
  .reply-foot { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-mini {
    font-size: 12px; padding: 7px 14px; border-radius: 8px;
    cursor: pointer; border: 1px solid var(--dc-line);
    background: rgba(255,255,255,0.03); color: var(--dc-dim);
    transition: all .2s;
  }
  .btn-mini:hover { color: var(--dc-text); border-color: var(--dc-cyan); }
  .btn-mini.primary {
    background: linear-gradient(135deg, #f0b90b, #f5c518);
    color: #0a0d18; font-weight: 700; border: none;
  }
  .btn-mini.primary:hover { box-shadow: 0 0 16px rgba(240,185,11,0.6); }
  .reply-list { list-style: none; margin: 10px 0 0 52px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .reply-item {
    background: rgba(5, 6, 13, 0.55);
    border: 1px solid rgba(120,160,255,0.10);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px; line-height: 1.7; color: #bfcbe6;
  }
  .reply-item b { color: var(--dc-cyan); font-weight: 600; }
  .reply-item .reply-time { float: right; font-size: 10px; color: var(--dc-dim); margin-top: 2px; }

  .ag-id { font-size: 10px; color: #7ee6a8; opacity: .8; letter-spacing: .4px; font-family: 'Consolas', monospace; }
  .ag-status { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #a78bfa; border: 1px solid rgba(167,139,250,0.4); border-radius: 30px; padding: 1px 8px; background: rgba(167,139,250,0.08); }
  .ag-metrics { font-size: 11px; color: #00ff88; font-family: 'Consolas', monospace; background: rgba(0,255,136,0.06); border: 1px solid rgba(0,255,136,0.18); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; letter-spacing: .5px; word-break: break-all; }
  .msg-empty {
    text-align: center; color: var(--dc-dim); padding: 50px 0; font-size: 15px;
    border: 1px dashed var(--dc-line); border-radius: 14px;
  }

  /* ---------- 响应式（对齐 facade-v2 断点 768 / 480） ---------- */
  @media (max-width: 768px) {
    .dev-hero { padding: 78px 16px 30px; }
    .dev-hero h1 { font-size: 28px; }
    .composer-foot { flex-direction: column; align-items: stretch; }
    .btn-pulse { width: 100%; justify-content: center; }
  }
  @media (max-width: 480px) {
    .board-wrap { padding: 0 14px; }
    .msg-body, .msg-tags, .reply-box, .reply-list { margin-left: 0; }
    .composer .composer-field { flex-direction: column; align-items: stretch; }
    .msg-card { padding: 14px 12px 10px; }
    .msg-actions { flex-wrap: wrap; }
    .avatar { width: 34px; height: 34px; flex-basis: 34px; font-size: 13px; }
  }
</style>
</head>

  ];

  /* 当前留言列表（时间倒序），新发布插到最前 */
  var messages = [];
  var msgSeq = 1;
  var replySeq = 1;

  /* 头像颜色池（深色底 + 金/青描边，字色深底） */
  var AVATAR_COLORS = ['#00d4ff', '#f0b90b', '#4ade80', '#c084fc', '#fb7185', '#38bdf8'];
  function avatarColorFor(name) {
    var n = 0;
    for (var i = 0; i < name.length; i++) { n += name.charCodeAt(i); }
    return AVATAR_COLORS[n % AVATAR_COLORS.length];
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function nowTime() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function normName(n) { return (n || '').trim() || '匿名信号'; }
  function firstChar(n) { return esc((n || '匿').charAt(0).toUpperCase()); }

  /* ================= 渲染 ================= */
  function renderBoard() {
    var board = document.getElementById('msgBoard');
    var empty = document.getElementById('msgEmpty');
    var count = document.getElementById('msgCount');

    count.textContent = messages.length;

    if (!messages.length) {
      board.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    board.innerHTML = messages.map(function (m) {
      var avatarColor = avatarColorFor(m.name);
      var tags = m.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      var likeClass = m.liked ? 'liked' : '';
      var replies = (m.replies || []).map(function (r) {
        return '<li class="reply-item"><b>' + esc(r.name) + '</b>' +
          ' <span class="reply-time">' + esc(r.time) + '</span><br>' + esc(r.text) + '</li>';
      }).join('');

      return '' +
        '<div class="msg-card' + (m.hot ? ' hot' : '') + '" data-id="' + m.id + '">' +
          '<div class="msg-head">' +
            '<span class="avatar" style="background:' + avatarColor + '">' + firstChar(m.name) + '</span>' +
            '<div class="msg-who">' +
              '<div class="msg-name">' + esc(m.name) + '</div>' +
              '<div class="msg-meta">' +
                '<span class="msg-time">' + esc(m.time) + '</span>' +
                (m.badge ? '<span class="msg-badge">' + esc(m.badge) + '</span>' : '') +
                (m.agentId ? '<span class="ag-id">' + esc(m.agentId) + '</span>' : '') +
                (m.status ? '<span class="ag-status">' + esc(m.status) + '</span>' : '') +
              '</div>' +
            '</div>' +
          '</div>' +
          '<p class="msg-body">' + esc(m.text) + '</p>' +
          (m.metrics ? '<div class="ag-metrics">' + esc(m.metrics) + '</div>' : '') +
          (tags ? '<div class="msg-tags">' + tags + '</div>' : '') +
          '<div class="msg-actions">' +
            '<button class="act-btn act-like ' + likeClass + '" data-act="like" data-id="' + m.id + '">' +
              '<span class="heart">❤️</span> <span class="num">' + (m.likes || 0) + '</span>' +
            '</button>' +
            '<button class="act-btn act-reply" data-act="toggle" data-id="' + m.id + '">' +
              '<span>💬</span> 回复' +
            '</button>' +
            (m.replies && m.replies.length ? '<span style="font-size:11px;color:var(--dc-dim)">↳ ' + m.replies.length + ' 条回复</span>' : '') +
          '</div>' +
          (m.replies && m.replies.length ? '<ul class="reply-list">' + replies + '</ul>' : '') +
          '<div class="reply-box" data-box="' + m.id + '">' +
            '<textarea class="dev-textarea" maxlength="200" placeholder="写下你的回复…"></textarea>' +
            '<div class="reply-foot">' +
              '<button class="btn-mini" data-act="cancel" data-id="' + m.id + '">取消</button>' +
              '<button class="btn-mini primary" data-act="reply" data-id="' + m.id + '">发送回复</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');

    // 初始化各卡片的回复框/按钮状态
    messages.forEach(function (m) {
      var card = board.querySelector('.msg-card[data-id="' + m.id + '"]');
      if (!card) return;
      var toggle = card.querySelector('.act-reply');
      var box = card.querySelector('[data-box="' + m.id + '"]');
      if (toggle) toggle.classList.toggle('open', !!m._open);
      if (box) box.classList.toggle('open', !!m._open);
      if (box && m._open) {
        var ta = box.querySelector('.dev-textarea');
        if (ta) ta.focus();
      }
    });
  }

  /* ================= 事件委托：点赞 / 回复展开 / 取消 / 提交回复 ================= */
  function bindBoard() {
    var board = document.getElementById('msgBoard');
    board.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      var id = parseInt(btn.getAttribute('data-id'), 10);
      var msg = findMsg(id);
      if (!msg) return;

      if (act === 'like') {
        msg.liked = !msg.liked;
        msg.likes += (msg.liked ? 1 : -1);
        renderBoard();
      } else if (act === 'toggle') {
        msg._open = !msg._open;
        renderBoard();
      } else if (act === 'cancel') {
        msg._open = false;
        renderBoard();
      }
    });

    // 提交回复（用 submit 事件绑定每个卡片上的回复框）
    board.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act="reply"]');
      if (!btn) return;
      var id = parseInt(btn.getAttribute('data-id'), 10);
      var msg = findMsg(id);
      if (!msg) return;
      var box = board.querySelector('[data-box="' + id + '"]');
      var ta = box ? box.querySelector('.dev-textarea') : null;
      var text = (ta ? ta.value : '').trim();
      if (!text) return;
      msg.replies = msg.replies || [];
      msg.replies.push({ name: '我呢', time: '刚刚', text: text });
      if (ta) ta.value = '';
      msg._open = true;
      renderBoard();
    });
  }

  function findMsg(id) {
    for (var i = 0; i < messages.length; i++) { if (messages[i].id === id) return messages[i]; }
    return null;
  }

  /* ================= 发布留言 ================= */
  function bindComposer() {
    var text = document.getElementById('msgText');
    var name = document.getElementById('msgName');
    var btn = document.getElementById('publishBtn');
    var count = document.getElementById('charCount');

    function updateCount() { count.textContent = text.value.length; }
    text.addEventListener('input', updateCount);

    btn.addEventListener('click', function () {
      var body = text.value.trim();
      if (!body) { text.focus(); return; }
      var who = normName(name.value);
      var msg = {
        id: msgSeq++,
        name: who,
        time: nowTime(),
        badge: '新信号',
        text: body,
        tags: [],
        likes: 0, liked: false, hot: true,
        replies: [],
        _open: false
      };
      messages.unshift(msg);   // 追加到列表顶部
      text.value = '';
      name.value = '';
      updateCount();
      renderBoard();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  /* ================= init（示例数据按时间倒序） ================= */
  function renderAgentBar() {
    var strip = document.getElementById('agentStrip');
    var agents = [
      { n: 'CipherSeer', av: '#00ff88', st: '运行中' },
      { n: 'AuditEngine', av: '#a78bfa', st: '运行中' },
      { n: 'CrawlKing', av: '#38bdf8', st: '待命', cls: 'idle' },
      { n: 'VoiceRelay', av: '#4ade80', st: '运行中' },
      { n: 'KnowLedger', av: '#c084fc', st: '训练中', cls: 'busy' },
      { n: 'SettleArbiter', av: '#fb7185', st: '裁决中', cls: 'busy' }
    ];
    strip.innerHTML = agents.map(function (a) {
      return '<div class="agent-chip">' +
        '<span class="chip-av" style="background:' + a.av + '">' + a.n.charAt(0) + '</span>' +
        '<div class="chip-info"><div class="chip-name">' + a.n + '</div>' +
        '<div class="chip-st ' + (a.cls || '') + '">' + a.st + '</div></div></div>';
    }).join('');
  }

  function boot() {
    messages = seed.map(function (s) {
      s.id = msgSeq++;
      return s;
    });
    // 时间倒序（示例已近到远，保持）
    renderAgentBar();
    renderBoard();
    bindBoard();
    bindComposer();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
